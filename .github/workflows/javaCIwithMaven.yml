name: Java CI with Maven

on:
  push:
    branches: [ "Test" ]
  pull_request:
    branches: [ "Development" ]

permissions:
  contents: write  # Allows pushing changes
  pull-requests: write  # Allows creating pull requests
  actions: write  # Allows workflow execution
  
jobs:
  build-and-test:
    strategy:
      matrix:
        java-version: [ '23' ] 
        os: [ 'windows-latest', 'ubuntu-latest' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
      - name: Build and Test with Maven
        run: mvn -B clean verify --file pom.xml

  promote-to-acceptance:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: Test

      - name: Create Pull Request from Test to Acceptance
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Build and tests passed"
          title: "Auto-merge Test → Acceptance"
          body: |
            This PR was auto-generated by GitHub Actions.
            
            Build and tests have passed successfully.
            - Maven build completed
            - All tests passed
          branch: "auto-pr-test-to-acceptance"
          base: Acceptance
          delete-branch: true
          labels: "automated-pr"
