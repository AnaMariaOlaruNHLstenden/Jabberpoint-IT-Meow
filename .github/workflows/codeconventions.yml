name: Code Conventions Check

on:
  push:
    branches: [ "Acceptance" ]
  pull_request:
    branches: [ "Acceptance" ]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  checkstyle:
    strategy:
      matrix:
        java-version: [ '23' ]
        os: [ 'windows-latest', 'ubuntu-latest' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
       
      - name: Configure Maven
        run: |
          echo "MAVEN_OPTS=-Xmx2048m" >> $GITHUB_ENV
          
      - name: Build without tests
        run: mvn -B clean compile -DskipTests=true
        
      - name: Run Checkstyle
        run: mvn -B checkstyle:check
        
      - name: Generate Checkstyle Report
        run: mvn -B checkstyle:checkstyle

      - name: Run Checkstyle
        run: mvn checkstyle:check
      - name: Generate Checkstyle Report
        run: mvn checkstyle:checkstyle

      - name: Upload Checkstyle Report
        uses: actions/upload-artifact@v3
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml

  promote-to-production:
    needs: checkstyle
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: Acceptance

      - name: Create Pull Request from Acceptance to Production
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Code conventions check passed"
          title: "Code Conventions Check Passed - Acceptance → Production"
          body: |
            This PR was auto-generated by GitHub Actions.
            
            Code conventions check has passed successfully.
            - Checkstyle verification completed
            - Code style standards met
          branch: "auto-pr-acceptance-to-production"
          base: Production
          delete-branch: true
          labels: "automated-pr,code-conventions" 