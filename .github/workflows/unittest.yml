name: Unit Tests

on:
  push:
    branches: [ "Test" ]
  pull_request:
    branches: [ "Test" ]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  test:
    strategy:
      matrix:
        java-version: [ '23' ]
        os: [ 'windows-latest', 'ubuntu-latest' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
      - name: Run Unit Tests
        run: mvn test
      - name: Generate Test Report
        run: mvn surefire-report:report
      - name: Upload Test Report
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: target/site/surefire-report.html

  promote-to-acceptance:
    needs: test
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: Test

      - name: Create Pull Request from Test to Acceptance
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Unit tests passed"
          title: "Unit Tests Passed - Test → Acceptance"
          body: |
            This PR was auto-generated by GitHub Actions.
            
            Unit tests have passed successfully.
            - All tests completed successfully
            - Test coverage report generated
          branch: "auto-pr-test-to-acceptance"
          base: Acceptance
          delete-branch: true
          labels: "automated-pr,unit-tests" 