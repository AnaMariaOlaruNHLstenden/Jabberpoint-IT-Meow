name: Production Tags with Maven

on:
  push:
    branches: [ "Production" ]
  pull_request:
    branches: [ "Acceptance" ]

permissions:
  contents: write  # Required for creating releases/tags
  pull-requests: write  # Required for creating PRs
  actions: write  # Required for workflow execution

jobs:
  verify-and-test:
    strategy:
      matrix:
        java-version: [ '23' ]
        os: [ 'windows-latest', 'ubuntu-latest' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
      - name: Build and Test with Maven
        run: mvn -B clean verify --file pom.xml

  promote-to-production:
    needs: verify-and-test
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: Acceptance

      - name: Create Pull Request from Acceptance to Production
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Acceptance verification passed"
          title: "Auto-merge Acceptance → Production"
          body: |
            This PR was auto-generated by GitHub Actions.
            
            Acceptance verification has passed successfully.
            - Build completed
            - Tests passed
            - Ready for production deployment
          branch: "auto-pr-acceptance-to-production"
          base: Production
          delete-branch: true
          labels: "automated-pr"

  release:
    needs: promote-to-production
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven
      - name: Build Production Package
        run: mvn -B clean package --file pom.xml

      - name: Get Current Date
        id: date
        run: echo "RELEASE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create Release Tag
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          git tag $VERSION
          git push origin $VERSION

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release - ${{ env.RELEASE_DATE }}"
          body: |
            Automated Release for Production
            
            Version: v1.0.${{ github.run_number }}
            Build Number: ${{ github.run_number }}
            Date: ${{ env.RELEASE_DATE }}
          draft: false
          prerelease: false
          files: target/*.jar
