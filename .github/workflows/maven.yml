# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "Test" ]
  pull_request:
    branches: [ "Test" ]

permissions:
  contents: write  # Allows pushing changes
  
jobs:
  build:

    strategy:
      matrix:
        java-version: [ '17', '18', '19', '20', '21', '22', '23' ] 
        os: [ 'windows-latest', 'ubuntu-latest' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

  promote-to-acceptance:
    runs-on: ${{ matrix.os }}  
    needs: build 
    if: success() 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: Test  

      - name: Merge Test into Acceptance
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch origin Acceptance  # Fetch the Acceptance branch
          git checkout Acceptance  # Switch to the Acceptance branch
          git merge Test --no-ff -m "Merged Test into Acceptance via GitHub Actions"  # Merge Test into Acceptance
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/AnaMariaOlaruNHLstenden/Jabberpoint-IT-Meow.git Acceptance  # Push using token
