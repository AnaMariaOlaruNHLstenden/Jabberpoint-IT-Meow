name: Production Tags with Maven

on:
  push:
    branches: [ "Production" ]  # Runs only on Production pushes

permissions:
  contents: write  # Required for creating releases/tags

jobs:
  release:
    strategy:
      matrix:
        java-version: [ '17', '18', '19', '20', '21', '22', '23' ] 
        os: [ 'windows-latest', 'ubuntu-latest' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Get Current Date
        id: date
        run: echo "RELEASE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create Release Tag
        run: |
          VERSION="v1.0.${{ github.run_number }}"  # Auto-increment version
          git tag $VERSION
          git push origin $VERSION

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}  # Uses the created tag
          name: "Release - ${{ env.RELEASE_DATE }}"
          body: "Automated Release for Production"
          draft: false
          prerelease: false
