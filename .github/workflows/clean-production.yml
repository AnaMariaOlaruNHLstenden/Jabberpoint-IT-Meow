name: Clean Production Branch

on:
  push:
    branches: [ "Acceptance" ]
  pull_request:
    branches: [ "Acceptance" ]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  clean-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: Acceptance
          fetch-depth: 0

      - name: Remove test files
        run: |
          # Remove test directories
          rm -rf src/test/
          rm -rf target/surefire-reports/
          rm -rf target/site/surefire-report.html
          
          # Remove test-related files from root
          rm -f pom.xml.test
          rm -f test-results.xml
          
          # Update .gitignore to exclude tests
          echo "# Test files" >> .gitignore
          echo "src/test/" >> .gitignore
          echo "target/surefire-reports/" >> .gitignore
          echo "target/site/surefire-report.html" >> .gitignore
          echo "pom.xml.test" >> .gitignore
          echo "test-results.xml" >> .gitignore

      - name: Commit cleaned code
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Remove test files and update .gitignore"

      - name: Create Pull Request to Production
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Clean production branch - remove test files"
          title: "Clean Production Branch - Remove Test Files"
          body: |
            This PR was auto-generated by GitHub Actions.
            
            Test files have been removed from the codebase:
            - Removed src/test/ directory
            - Removed test reports
            - Updated .gitignore to exclude test files
            - Cleaned up test-related files
          branch: "clean-production-branch"
          base: Production
          delete-branch: true
          labels: "automated-pr,cleanup" 